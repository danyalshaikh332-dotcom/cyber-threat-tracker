<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Threat Intelligence Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; }
        nav {
            background: #161b22;
            padding: 14px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }
        nav .brand { font-size: 18px; font-weight: bold; color: #58a6ff; letter-spacing: 1px; }
        nav a { color: #8b949e; text-decoration: none; margin-left: 20px; font-size: 14px; }
        nav a:hover { color: #58a6ff; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            text-decoration: none;
        }
        .btn-primary { background: #238636; color: white; }
        .btn-primary:hover { background: #2ea043; }
        .btn-danger { background: #da3633; color: white; }
        .btn-danger:hover { background: #f85149; }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-critical { background: #da3633; color: white; }
        .badge-high { background: #d29922; color: #0d1117; }
        .badge-medium { background: #388bfd; color: white; }
        .badge-low { background: #238636; color: white; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <nav>
        <span class="brand">🛡 CTI Tracker</span>
        <div>
            <a href="/">Dashboard</a>
            <a href="/add">+ Log Threat</a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
